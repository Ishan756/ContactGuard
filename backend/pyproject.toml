[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contractguard-backend"
version = "0.1.0"
description = "AI-powered multi-agent contract risk auditing platform backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-multipart>=0.0.12",
    "PyMuPDF>=1.24.10",
    "python-docx>=1.1.2",
    "qdrant-client>=1.12.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "langgraph>=0.2.34",
    "langchain-core>=0.3.10",
    "google-genai>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
